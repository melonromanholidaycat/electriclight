name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Language and engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No dependencies: the unit tests and the bundler are plain node.
      - name: Unit tests and golden vectors
        run: node web/test/run.js
      # Also writes the golden vectors as a C header, which the host tests and
      # the firmware both compile, so it has to happen before either.
      - name: Build the page
        run: node web/build.js
      # The firmware's decision logic and its effect evaluator are plain C with
      # no ESP-IDF in them, so the parts that decide whether a closed guitar
      # stays reachable - and the part that has to agree with the browser pixel
      # for pixel - are tested here in seconds rather than on hardware.
      - name: JSON library for firmware integration tests
        run: sudo apt-get update -qq && sudo apt-get install -y libcjson-dev
      - name: Firmware core tests, on the host
        run: firmware/test_host/run.sh
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: dist/

  smoke:
    name: Page boots in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node web/build.js
      - run: node web/test/smoke.mjs

  firmware:
    name: Firmware (${{ matrix.flash }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flash: 4mb
            defaults: sdkconfig.defaults
          - flash: 16mb
            defaults: sdkconfig.defaults;sdkconfig.16mb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The firmware embeds the same page the simulator publishes, so it has to
      # be generated before the firmware can compile at all.
      - name: Generate the embedded page
        run: node web/build.js
      - name: Build for ESP32-S3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4
          target: esp32s3
          path: firmware
          command: idf.py -DSDKCONFIG_DEFAULTS="${{ matrix.defaults }}" build
      # Downloadable so a firmware image can be uploaded to the guitar from the
      # phone's Files app when the normal path is broken. That fallback only
      # exists if the image is easy to get hold of.
      #
      # ota_data_initial.bin is in the list because leaving it out breaks the one
      # scenario a cable is for. It is the partition that records which app slot
      # to boot. On a virgin chip that partition is erased and the bootloader
      # falls back to ota_0, so a first flash works without it - but once the
      # guitar has taken a single OTA it is running from ota_1, and a rescue
      # flash that writes ota_0 and leaves this alone boots the broken image
      # again. The cable session would achieve nothing, on a board with no
      # serial console to say why.
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3-${{ matrix.flash }}
          path: |
            firmware/build/electriclight.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
          if-no-files-found: error

  deploy:
    name: Publish simulator and flasher to Pages
    # Gated on the firmware build, which the simulator alone never was. The page
    # now ships the firmware binaries beside it, and a deploy that refreshed the
    # page while leaving yesterday's binaries in place is exactly the kind of
    # silent mismatch this project is built to avoid. The cost is that a broken
    # firmware build also holds back a simulator change; the previously deployed
    # simulator stays up either way.
    needs: [test, smoke, firmware]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node web/build.js
      # The flasher serves these over HTTPS, which is what Web Serial requires,
      # so a borrowed computer needs nothing but a browser tab.
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-esp32s3-*
          path: fw
      - name: Place the firmware beside the flasher
        run: |
          set -eu
          for v in 4mb 16mb; do
            src="fw/firmware-esp32s3-$v"
            dst="dist/firmware/$v"
            mkdir -p "$dst"
            cp "$src/electriclight.bin" "$dst/"
            cp "$src/ota_data_initial.bin" "$dst/"
            cp "$src/bootloader/bootloader.bin" "$dst/"
            cp "$src/partition_table/partition-table.bin" "$dst/"
          done
      - name: Refuse to publish a flasher that cannot flash
        run: node -e "import('./web/gen-flasher.js').then((m) => m.verifyPublished('dist'))"
      # enablement turns Pages on via the API on the first run, so nobody has to
      # find the setting in repository settings on a phone.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
